name: Backend tests
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Test new foundation only
        run: python -m unittest discover -s tests -v
      - name: Test portable BlueStacks diagnostic and adapter logic
        env:
          PYTHONPATH: windows/tools
        run: |
          python -m unittest discover -s windows/tests -p 'test_network*.py' -v
          python -m unittest discover -s windows/tests -p 'test_bluestacks_adapter.py' -v
          python -m unittest discover -s windows/tests -p 'test_setup_local.py' -v
          python -m unittest discover -s windows/tests -p 'test_diagnose_setup.py' -v
          python -m unittest discover -s windows/tests -p 'test_instance_manager.py' -v
          python -m unittest discover -s windows/tests -p 'test_missing_requests.py' -v
