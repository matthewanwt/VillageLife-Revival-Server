name: New backend and Windows compatibility
permissions:
  contents: read
on:
  push:
  pull_request:
jobs:
  python_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install NEW backend
        run: python -m pip install -e .
      - name: Run new backend and instance/save regression tests
        run: python -m unittest discover -s tests -v
      - name: Source-only release audit
        run: python tools/release_audit.py
      - name: Large-save request performance budget
        run: python tools/benchmark_save_requests.py
      - name: Audit pinned build dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements-build.txt --format json --output dependency-advisories.json
  windows_source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Install NEW backend
        run: python -m pip install -e .
      - name: Windows SQLite file-handle and instance regression tests
        run: python -m unittest discover -s tests -v
      - name: Compile Windows test manager (no installer)
        run: dotnet build windows/launcher/VillageLifeLauncher.csproj -c Release
      - name: Audit transitive NuGet dependencies
        run: |
          dotnet package list --project windows/launcher/VillageLifeLauncher.csproj --vulnerable --include-transitive --format json > nuget-advisories.json
          python -c "import json; d=json.load(open('nuget-advisories.json')); assert not any(p.get('vulnerabilities') for x in d.get('projects',[]) for f in x.get('frameworks',[]) for k in ('topLevelPackages','transitivePackages') for p in f.get(k,[])), 'Vulnerable NuGet dependencies found'"
      - name: Prevent accidental original game or old backend bundling
        run: python tools/release_audit.py
      - name: Audit Windows build dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements-build.txt --format json --output dependency-advisories-windows.json
