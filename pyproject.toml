[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "villagelife-revival-server"
version = "0.1.0a1"
description = "Modular preservation backend and save migration toolkit for a Village Life community project"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
villagelife-server = "villagelife.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
